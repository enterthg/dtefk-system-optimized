<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ДТЕФК - Система розкладу</title>
<style>
  * { 
    margin: 0;
    padding: 0;
    box-sizing: border-box; 
  }
  
  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    overflow: hidden;
    color: white;
    background: #0f172a;
  }

  .background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(26, 42, 108, 0.7), rgba(178, 31, 31, 0.7)), 
                url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&h=1080&fit=crop') center/cover;
    background-attachment: fixed;
    z-index: -2;
  }

  .background::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, rgba(26, 42, 108, 0.3), rgba(178, 31, 31, 0.3), rgba(253, 187, 45, 0.2), rgba(26, 42, 108, 0.3));
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #weather-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 0;
    gap: 0;
    z-index: 1;
    overflow: hidden;
  }

  /* ХЕДЕР */
  .header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 15px 20px;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .logo img {
    height: 80px;
    width: auto;
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
    animation: logoBreathe 6s ease-in-out infinite;
    object-fit: contain;
  }

  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .weather {
    font-size: 50px;
    font-weight: bold;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
  }

  .weather span:last-child {
    font-size: 40px;
  }

  /* ОСНОВНИЙ КОНТЕНТ */
  .content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    padding: 15px;
    overflow: hidden;
  }

  /* ЗАМІНИ */
  .replaces-panel {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(25px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .replaces-title {
    padding: 12px 15px;
    background: rgba(0, 0, 0, 0.4);
    font-size: 18px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(0, 255, 245, 0.3);
  }

  #replacesList {
    padding: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .replace-item {
    display: grid;
    grid-template-columns: auto 1fr 60px;
    background: rgba(255, 255, 255, 0.08);
    padding: 10px 12px;
    border-radius: 12px;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 255, 245, 0.2);
    font-size: 13px;
  }

  .replace-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateX(3px);
  }

  .rep-group {
    font-weight: 900;
    color: #00fff5;
    font-size: 14px;
    white-space: nowrap;
    min-width: 80px;
  }

  .rep-info {
    word-break: break-word;
    font-size: 12px;
    opacity: 0.9;
    line-height: 1.3;
  }

  .rep-room {
    background: #00fff5;
    color: #000;
    text-align: center;
    border-radius: 6px;
    font-weight: 900;
    font-size: 14px;
    padding: 4px 2px;
    min-width: 55px;
  }

  /* ГОДИННИК */
  .center-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
  }

  #clock {
    font-size: 100px;
    font-weight: 900;
    line-height: 0.9;
    text-shadow: 0 0 40px rgba(0, 198, 255, 0.8);
    font-variant-numeric: tabular-nums;
  }

  #date {
    font-size: 16px;
    opacity: 0.95;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
  }

  #lessonInfo {
    font-size: 32px;
    font-weight: 800;
    padding: 10px 30px;
    border-radius: 30px;
    background: rgba(0, 255, 245, 0.2);
    border: 2px solid #00fff5;
    color: #00fff5;
    transition: all 0.3s ease;
    text-shadow: 0 0 15px rgba(0, 255, 245, 0.5);
  }

  /* МОДАЛЬ */
  .admin-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 600px;
    max-height: 85vh;
    background: rgba(20, 30, 50, 0.95);
    color: #fff;
    padding: 20px;
    border-radius: 20px;
    z-index: 100;
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
    overflow-y: auto;
    border: 2px solid rgba(0, 255, 245, 0.3);
    -webkit-overflow-scrolling: touch;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.9);
    z-index: 99;
  }

  .modal-title {
    color: #00fff5;
    margin: 0 0 15px 0;
    font-size: 22px;
    text-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
  }

  #scheduleInputs {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 8px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .input-row input {
    padding: 8px 6px;
    border-radius: 6px;
    border: 1px solid rgba(0,255,245,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 13px;
  }

  .input-row input[type="text"] {
    width: 45px;
  }

  .input-row input[type="time"] {
    flex: 1;
  }

  .input-row input::placeholder {
    color: rgba(255,255,255,0.5);
  }

  .input-row button {
    background: #ff4757;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
  }

  .input-row button:active {
    background: #ff3838;
    transform: scale(0.95);
  }

  .backup-zone {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px dashed rgba(255,255,255,0.3);
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-backup {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 13px;
    transition: all 0.3s;
  }

  .btn-backup:active {
    transform: scale(0.95);
  }

  .btn-add {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.3s;
    width: 100%;
    font-weight: bold;
    font-size: 14px;
  }

  .btn-add:active {
    background: #27ae60;
    transform: scale(0.95);
  }

  .btn-save {
    background: #1a2a6c;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s;
  }

  .btn-save:active {
    background: #2c3d7d;
    transform: scale(0.95);
  }

  /* ФУТЕР */
  .footer {
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: 0.4;
    transition: 0.3s;
    z-index: 5;
    padding: 10px;
    background: rgba(0, 0, 0, 0.1);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    flex-wrap: wrap;
  }

  .footer:active {
    opacity: 1;
  }

  .footer button {
    padding: 8px 16px;
    font-size: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .footer button:active {
    background: rgba(0, 255, 245, 0.2);
    border-color: #00fff5;
    transform: scale(0.95);
  }

  /* СИСТЕМА ТРИВОГ */
  #airAlertBox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 0, 0, 0.2);
    backdrop-filter: blur(8px);
    z-index: 1001;
    pointer-events: none;
  }

  #airAlertBox.active {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: alertFlash 0.8s infinite;
  }

  @keyframes alertFlash {
    0%, 49% { background: rgba(255, 0, 0, 0.15); }
    50%, 100% { background: rgba(255, 0, 0, 0.35); }
  }

  #alertContent {
    text-align: center;
    font-size: 80px;
    font-weight: 900;
    color: #ff0000;
    text-shadow: 0 0 40px rgba(255, 0, 0, 1);
    animation: alertBlink 0.5s infinite, alertPulse 1.5s ease-in-out infinite;
    font-family: 'Arial', sans-serif;
  }

  #alertIcon {
    font-size: 120px;
    margin-bottom: 15px;
    animation: alertShake 0.4s infinite;
  }

  #alertText {
    font-size: 50px;
    margin-bottom: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #alertTime {
    font-size: 40px;
    color: #ffaa00;
    margin-top: 15px;
    font-weight: bold;
  }

  @keyframes alertBlink {
    0%, 50% { opacity: 1; }
    25%, 75% { opacity: 0.4; }
  }

  @keyframes alertPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @keyframes alertShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-12px) rotate(-6deg); }
    75% { transform: translateX(12px) rotate(6deg); }
  }

  /* МОБІЛЬНА ОПТИМІЗАЦІЯ */
  @media (max-width: 900px) {
    .content {
      grid-template-columns: 1fr;
    }

    #clock {
      font-size: 70px;
    }

    #lessonInfo {
      font-size: 24px;
      padding: 8px 20px;
    }

    .replaces-title {
      font-size: 16px;
    }

    .replace-item {
      grid-template-columns: auto 1fr 50px;
      font-size: 11px;
      padding: 8px 10px;
    }
  }

  @media (max-width: 600px) {
    .header {
      grid-template-columns: auto 1fr;
      padding: 10px;
      gap: 10px;
    }

    .logo img {
      height: 60px;
    }

    .weather {
      font-size: 36px;
      gap: 5px;
    }

    .weather span:last-child {
      font-size: 28px;
    }

    .content {
      padding: 10px;
      gap: 10px;
    }

    #clock {
      font-size: 50px;
    }

    #date {
      font-size: 13px;
    }

    #lessonInfo {
      font-size: 18px;
      padding: 6px 15px;
      border-width: 1.5px;
    }

    .replaces-panel {
      border-radius: 15px;
    }

    .replaces-title {
      font-size: 14px;
      padding: 10px 12px;
    }

    #replacesList {
      padding: 10px;
      gap: 6px;
    }

    .replace-item {
      grid-template-columns: auto 1fr 45px;
      font-size: 10px;
      padding: 7px 8px;
      border-radius: 10px;
    }

    .rep-group {
      font-size: 12px;
    }

    .rep-room {
      font-size: 12px;
      min-width: 45px;
      padding: 3px 2px;
    }

    .footer {
      gap: 8px;
      padding: 8px;
    }

    .footer button {
      padding: 7px 12px;
      font-size: 11px;
    }

    .admin-modal {
      width: 95vw;
      max-height: 90vh;
      padding: 15px;
    }

    .modal-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .input-row input[type="text"] {
      width: 40px;
    }

    .btn-add, .btn-save {
      font-size: 13px;
      padding: 10px;
    }

    .backup-zone {
      margin-top: 12px;
      padding-top: 12px;
      gap: 8px;
    }

    .btn-backup {
      padding: 8px 12px;
      font-size: 11px;
    }

    #alertText {
      font-size: 36px;
      letter-spacing: 2px;
    }

    #alertIcon {
      font-size: 80px;
      margin-bottom: 10px;
    }

    #alertTime {
      font-size: 28px;
      margin-top: 10px;
    }
  }

  @media (max-width: 400px) {
    .logo img {
      height: 50px;
    }

    .weather {
      font-size: 28px;
    }

    #clock {
      font-size: 42px;
    }

    #lessonInfo {
      font-size: 16px;
      padding: 5px 10px;
    }

    .replaces-title {
      font-size: 12px;
    }

    .replace-item {
      grid-template-columns: auto 1fr 40px;
      font-size: 9px;
      padding: 6px 6px;
    }
  }

  /* Приховування скролбара на мобільних */
  @supports (padding: max(0px)) {
    body {
      padding-left: max(0px, env(safe-area-inset-left));
      padding-right: max(0px, env(safe-area-inset-right));
      padding-top: max(0px, env(safe-area-inset-top));
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<div class="background"></div>
<div id="weather-effects"></div>
<div id="airAlertBox"></div>
<div class="modal-overlay" id="overlay" onclick="toggleAdmin()"></div>

<div class="admin-modal" id="adminModal">
  <h2 class="modal-title">⚙️ Налаштування</h2>
  <div id="scheduleInputs"></div>
  
  <button onclick="addInputRow()" class="btn-add">+ Додати урок</button>
  <button onclick="saveSchedule()" class="btn-save">💾 Зберегти</button>

  <div class="backup-zone">
    <button onclick="exportSchedule()" class="btn-backup" style="background: #3498db;">📥 Експорт</button>
    <button onclick="document.getElementById('importFile').click()" class="btn-backup" style="background: #e67e22;">📤 Імпорт</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importSchedule(this)">
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="logo"><img src="logo.webp" alt="Лого" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Crect fill=%22%2300fff5%22 width=%22180%22 height=%22180%22/%3E%3Ctext x=%2290%22 y=%22100%22 font-size=%2240%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%231a2a6c%22%3EДТЕФК%3C/text%3E%3C/svg%3E'"></div>
    <div class="weather"><span id="weatherIcon">☀️</span><span id="temp">--</span>°</div>
  </div>

  <div class="content">
    <div class="replaces-panel">
      <div class="replaces-title"><span>📝 ЗАМІНИ</span><span id="pageInfo" style="font-size: 14px; opacity: 0.7;">0/0</span></div>
      <div id="replacesList"></div>
    </div>

    <div class="center-display">
      <h1 id="clock">00:00</h1>
      <div id="date">Завантаження...</div>
      <div id="lessonInfo">Очікування...</div>
    </div>
  </div>

  <div class="footer">
    <button onclick="toggleAdmin()" title="Налаштування">⚙️ Налаштування</button>
    <button onclick="fetchReplaces()" title="Оновити">🔄 Оновити</button>
    <button onclick="toggleFullscreen()" title="Екран">🖥 Екран</button>
  </div>
</div>

<audio id="bell"></audio>

<script src="script.js"></script>

</body>
</html>
