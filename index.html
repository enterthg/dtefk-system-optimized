<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДТЕФК - Система розкладу</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: white;
    background: #0f172a;
  }

  .background {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(26, 42, 108, 0.7), rgba(178, 31, 31, 0.7)), 
                url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&h=1080&fit=crop') center/cover;
    background-attachment: fixed;
    z-index: -2;
    animation: zoomBg 30s ease-in-out infinite;
  }

  @keyframes zoomBg {
    0%, 100% { background-size: 100% 100%; }
    50% { background-size: 105% 105%; }
  }

  .background::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, rgba(26, 42, 108, 0.3), rgba(178, 31, 31, 0.3), rgba(253, 187, 45, 0.3), rgba(26, 42, 108, 0.3));
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    pointer-events: none;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #weather-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .container {
    position: relative;
    height: 100vh;
    display: grid;
    grid-template-columns: 750px 1fr;
    grid-template-rows: 180px 1fr 100px;
    padding: 40px 60px;
    gap: 30px;
    z-index: 1;
  }

  .logo img {
    height: 180px;
    filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
    animation: logoBreathe 6s ease-in-out infinite;
    object-fit: contain;
  }

  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .weather {
    font-size: 100px;
    font-weight: bold;
    text-shadow: 4px 4px 15px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .replaces-panel {
    grid-row: 2;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .replaces-title {
    padding: 20px 30px;
    background: rgba(0, 0, 0, 0.4);
    font-size: 32px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid rgba(0, 255, 245, 0.3);
  }

  #replacesList {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .replace-item {
    display: grid;
    grid-template-columns: 140px 1fr 100px;
    background: rgba(255, 255, 255, 0.08);
    padding: 15px 20px;
    border-radius: 15px;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 255, 245, 0.2);
  }

  .replace-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateX(5px);
    border-color: rgba(0, 255, 245, 0.5);
  }

  .rep-group {
    font-weight: 900;
    color: #00fff5;
    font-size: 20px;
  }

  .rep-room {
    background: #00fff5;
    color: #000;
    text-align: center;
    border-radius: 8px;
    font-weight: 900;
    font-size: 24px;
    padding: 5px 0;
  }

  .center-display {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    text-align: right;
  }

  #clock {
    font-size: 220px;
    font-weight: 900;
    line-height: 0.8;
    text-shadow: 0 0 60px rgba(0, 198, 255, 0.8);
    letter-spacing: -5px;
    font-variant-numeric: tabular-nums;
  }

  #date {
    font-size: 24px;
    opacity: 0.95;
    margin-bottom: 20px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
  }

  #lessonInfo {
    font-size: 60px;
    font-weight: 800;
    margin-top: 40px;
    padding: 15px 60px;
    border-radius: 100px;
    background: rgba(0, 255, 245, 0.2);
    border: 2px solid #00fff5;
    color: #00fff5;
    transition: all 0.3s ease;
    text-shadow: 0 0 20px rgba(0, 255, 245, 0.5);
  }

  .admin-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    max-height: 90vh;
    background: rgba(20, 30, 50, 0.95);
    color: #fff;
    padding: 30px;
    border-radius: 25px;
    z-index: 100;
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
    overflow-y: auto;
    border: 2px solid rgba(0, 255, 245, 0.3);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.9);
    z-index: 99;
  }

  .backup-zone {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 2px dashed rgba(255,255,255,0.3);
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-backup {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: all 0.3s;
  }

  .btn-backup:hover {
    transform: scale(1.05);
  }

  .footer {
    grid-column: 1 / 3;
    display: flex;
    justify-content: center;
    gap: 20px;
    opacity: 0.3;
    transition: 0.3s;
    z-index: 5;
  }

  .footer:hover {
    opacity: 1;
  }

  .footer button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }

  .footer button:hover {
    background: rgba(0, 255, 245, 0.2);
    border-color: #00fff5;
    transform: translateY(-2px);
  }

  #scheduleInputs {
    max-height: 350px;
    overflow-y: auto;
    padding-right: 10px;
    margin-bottom: 15px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }

  .input-row input {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid rgba(0,255,245,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
  }

  .input-row input[type="text"] {
    width: 50px;
  }

  .input-row input[type="time"] {
    flex: 1;
  }

  .input-row button {
    background: #ff4757;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 8px 15px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .input-row button:hover {
    background: #ff3838;
    transform: scale(1.05);
  }

  .btn-add {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.3s;
    width: 100%;
  }

  .btn-add:hover {
    background: #27ae60;
  }

  .btn-save {
    background: #1a2a6c;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    transition: all 0.3s;
  }

  .btn-save:hover {
    background: #2c3d7d;
  }

  .modal-title {
    color: #00fff5;
    margin-top: 0;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
  }

  /* СИСТЕМА ТРИВОГ */
  #airAlertBox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 0, 0, 0.2);
    backdrop-filter: blur(8px);
    z-index: 1001;
    pointer-events: none;
  }

  #airAlertBox.active {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: alertFlash 0.8s infinite;
  }

  @keyframes alertFlash {
    0%, 49% { background: rgba(255, 0, 0, 0.15); }
    50%, 100% { background: rgba(255, 0, 0, 0.35); }
  }

  #alertContent {
    text-align: center;
    font-size: 100px;
    font-weight: 900;
    color: #ff0000;
    text-shadow: 0 0 40px rgba(255, 0, 0, 1);
    animation: alertBlink 0.5s infinite, alertPulse 1.5s ease-in-out infinite;
    font-family: 'Arial', sans-serif;
  }

  #alertIcon {
    font-size: 150px;
    margin-bottom: 20px;
    animation: alertShake 0.4s infinite;
  }

  #alertText {
    font-size: 70px;
    margin-bottom: 30px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  #alertTime {
    font-size: 50px;
    color: #ffaa00;
    margin-top: 20px;
    font-weight: bold;
  }

  @keyframes alertBlink {
    0%, 50% { opacity: 1; }
    25%, 75% { opacity: 0.4; }
  }

  @keyframes alertPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @keyframes alertShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-15px) rotate(-8deg); }
    75% { transform: translateX(15px) rotate(8deg); }
  }

  @media (max-width: 1400px) {
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: 150px 1fr 100px;
    }

    #clock {
      font-size: 120px;
    }

    #lessonInfo {
      font-size: 40px;
      padding: 10px 30px;
    }
  }
</style>
</head>
<body>

<div class="background"></div>
<div id="weather-effects"></div>
<div id="airAlertBox"></div>
<div class="modal-overlay" id="overlay" onclick="toggleAdmin()"></div>

<div class="admin-modal" id="adminModal">
  <h2 class="modal-title">⚙️ Налаштування розкладу</h2>
  <div id="scheduleInputs"></div>
  
  <button onclick="addInputRow()" class="btn-add">+ Додати урок</button>
  <button onclick="saveSchedule()" class="btn-save">💾 Зберегти</button>

  <div class="backup-zone">
    <button onclick="exportSchedule()" class="btn-backup" style="background: #3498db;">📥 Експорт</button>
    <button onclick="document.getElementById('importFile').click()" class="btn-backup" style="background: #e67e22;">📤 Імпорт</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importSchedule(this)">
  </div>
</div>

<div class="container">
  <div class="top-left">
    <div class="logo"><img src="logo.webp" alt="Лого" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Crect fill=%22%2300fff5%22 width=%22180%22 height=%22180%22/%3E%3Ctext x=%2290%22 y=%22100%22 font-size=%2240%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%231a2a6c%22%3EДТЕФК%3C/text%3E%3C/svg%3E'"></div>
  </div>
  <div class="top-right">
    <div class="weather"><span id="weatherIcon">☀️</span><span id="temp">--</span>°C</div>
  </div>

  <div class="replaces-panel">
    <div class="replaces-title"><span>📝 ЗАМІНИ</span><span id="pageInfo" style="font-size: 20px; opacity: 0.7;">0/0</span></div>
    <div id="replacesList"></div>
  </div>

  <div class="center-display">
    <h1 id="clock">00:00:00</h1>
    <div id="date">Завантаження...</div>
    <div id="lessonInfo">Очікування...</div>
  </div>

  <div class="footer">
    <button onclick="toggleAdmin()" title="Налаштування розкладу">⚙️ Налаштування</button>
    <button onclick="fetchReplaces()" title="Оновити список замін">🔄 Оновити</button>
    <button onclick="toggleFullscreen()" title="Повноекранний режим">🖥 Екран</button>
  </div>
</div>

<audio id="bell"></audio>

<script src="script.js"></script>

</body>
</html>
