<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДТЕФК - Система розкладу</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: white;
    background: #0f172a;
  }

  .background {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d, #1a2a6c);
    background-size: 400% 400%;
    animation: gradientMove 20s ease infinite;
    z-index: -2;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #weather-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .container {
    position: relative;
    height: 100vh;
    display: grid;
    grid-template-columns: 750px 1fr;
    grid-template-rows: 180px 1fr 100px;
    padding: 40px 60px;
    gap: 30px;
  }

  .logo img {
    height: 180px;
    filter: drop-shadow(0 0 30px rgba(0,0,0,0.3));
    animation: logoBreathe 6s ease-in-out infinite;
    object-fit: contain;
  }

  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .weather {
    font-size: 100px;
    font-weight: bold;
    text-shadow: 4px 4px 15px rgba(0,0,0,0.4);
  }

  .replaces-panel {
    grid-row: 2;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .replaces-title {
    padding: 20px 30px;
    background: rgba(255, 255, 255, 0.1);
    font-size: 32px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
  }

  #replacesList {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .replace-item {
    display: grid;
    grid-template-columns: 140px 1fr 100px;
    background: rgba(255, 255, 255, 0.1);
    padding: 15px 20px;
    border-radius: 15px;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
  }

  .replace-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateX(5px);
  }

  .rep-group {
    font-weight: 900;
    color: #00fff5;
    font-size: 20px;
  }

  .rep-room {
    background: #00fff5;
    color: #000;
    text-align: center;
    border-radius: 8px;
    font-weight: 900;
    font-size: 24px;
    padding: 5px 0;
  }

  .center-display {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    text-align: right;
  }

  #clock {
    font-size: 220px;
    font-weight: 900;
    line-height: 0.8;
    text-shadow: 0 0 60px rgba(0, 198, 255, 0.6);
    letter-spacing: -5px;
  }

  #lessonInfo {
    font-size: 60px;
    font-weight: 800;
    margin-top: 40px;
    padding: 15px 60px;
    border-radius: 100px;
    background: rgba(0, 255, 245, 0.2);
    border: 2px solid #00fff5;
    color: #00fff5;
    transition: all 0.3s ease;
  }

  .admin-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    background: white;
    color: #333;
    padding: 30px;
    border-radius: 25px;
    z-index: 100;
    box-shadow: 0 0 100px rgba(0,0,0,0.5);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.8);
    z-index: 99;
  }

  .backup-zone {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 2px dashed #ccc;
    display: flex;
    gap: 15px;
    justify-content: center;
  }

  .btn-backup {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
  }

  .footer {
    grid-column: 1 / 3;
    display: flex;
    justify-content: center;
    gap: 20px;
    opacity: 0.2;
    transition: 0.3s;
  }

  .footer:hover {
    opacity: 1;
  }

  .footer button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 12px;
    border: 1px solid white;
    background: transparent;
    color: white;
    cursor: pointer;
  }

  #scheduleInputs {
    max-height: 350px;
    overflow-y: auto;
    padding-right: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .input-row input {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  .input-row input[type="text"] {
    width: 50px;
  }

  .input-row input[type="time"] {
    flex: 1;
  }

  .input-row button {
    background: #ff4757;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 0 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="background"></div>
<div id="weather-effects"></div>
<div class="modal-overlay" id="overlay" onclick="toggleAdmin()"></div>

<div class="admin-modal" id="adminModal">
  <h2 style="color: #1a2a6c; margin-top:0;">⚙️ Налаштування розкладу</h2>
  <div id="scheduleInputs"></div>
  
  <button onclick="addInputRow()" style="background:#2ecc71; color:white; border:none; padding:12px 20px; border-radius:10px; cursor:pointer; margin-top:10px;">+ Додати урок</button>
  <button onclick="saveSchedule()" style="background:#1a2a6c; color:white; border:none; padding:15px; border-radius:10px; cursor:pointer; width:100%; margin-top:15px; font-size:18px; font-weight:bold;">💾 Зберегти</button>

  <div class="backup-zone">
    <button onclick="exportSchedule()" class="btn-backup" style="background: #3498db;">📥 Експорт</button>
    <button onclick="document.getElementById('importFile').click()" class="btn-backup" style="background: #e67e22;">📤 Імпорт</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importSchedule(this)">
  </div>
</div>

<div class="container">
  <div class="top-left">
    <div class="logo"><img src="logo.webp" alt="Лого" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Crect fill=%22%2300fff5%22 width=%22180%22 height=%22180%22/%3E%3Ctext x=%2290%22 y=%22100%22 font-size=%2240%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%231a2a6c%22%3EДТЕФК%3C/text%3E%3C/svg%3E'"></div>
  </div>
  <div class="top-right">
    <div class="weather"><span id="weatherIcon">☀️</span><span id="temp">--</span>°C</div>
  </div>

  <div class="replaces-panel">
    <div class="replaces-title"><span>📝 ЗАМІНИ</span><span id="pageInfo" style="font-size: 20px; opacity: 0.6;">0/0</span></div>
    <div id="replacesList"></div>
  </div>

  <div class="center-display">
    <h1 id="clock">00:00:00</h1>
    <div id="date">Завантаження...</div>
    <div id="lessonInfo">Очікування...</div>
  </div>

  <div class="footer">
    <button onclick="toggleAdmin()">⚙️ Налаштування</button>
    <button onclick="fetchReplaces()">🔄 Оновити</button>
    <button onclick="toggleFullscreen()">🖥 Екран</button>
  </div>
</div>

<audio id="bell"></audio>

<script src="script.js"></script>

</body>
</html>
