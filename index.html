<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ДТЕФК - Система розкладу</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      overflow: hidden;
      color: white;
      background: #0f172a;
    }

    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      overflow: hidden;
    }

    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: opacity 1.5s ease-in-out;
      opacity: 0;
    }

    .bg-image-layer.active {
      opacity: 1;
    }

    .bg-iframe-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
      display: none;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, rgba(26, 42, 108, 0.35), rgba(178, 31, 31, 0.35), rgba(253, 187, 45, 0.25), rgba(26, 42, 108, 0.35));
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      pointer-events: none;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #weather-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      padding: 0;
      gap: 0;
      z-index: 1;
      overflow: hidden;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo img {
      height: var(--logo-height, 80px);
      width: auto;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
      animation: logoBreathe 6s ease-in-out infinite;
      object-fit: contain;
    }

    @keyframes logoBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .weather {
      font-size: 50px;
      font-weight: bold;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .weather span:last-child {
      font-size: 40px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 15px;
      overflow: hidden;
    }

    .replaces-panel {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .replaces-title {
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.4);
      font-size: var(--replaces-font-size, 18px);
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0, 255, 245, 0.3);
    }

    #replacesList {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .replace-item {
      display: grid;
      grid-template-columns: auto 1fr 60px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 12px;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 255, 245, 0.2);
      font-size: var(--replaces-font-size, 13px);
    }

    .replace-item:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(3px);
    }

    .rep-group {
      font-weight: 900;
      color: #00fff5;
      font-size: calc(var(--replaces-font-size, 13px) * 1.1);
      white-space: nowrap;
      min-width: 80px;
    }

    .rep-info {
      word-break: break-word;
      font-size: calc(var(--replaces-font-size, 13px) * 0.9);
      opacity: 0.9;
      line-height: 1.3;
    }

    .rep-room {
      background: #00fff5;
      color: #000;
      text-align: center;
      border-radius: 6px;
      font-weight: 900;
      font-size: calc(var(--replaces-font-size, 13px) * 1.1);
      padding: 4px 2px;
      min-width: 55px;
    }

    .center-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    #clock {
      font-size: var(--clock-font-size, 100px);
      font-weight: 900;
      line-height: 0.9;
      text-shadow: 0 0 40px rgba(0, 198, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }

    #date {
      font-size: var(--date-font-size, 16px);
      opacity: 0.95;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
    }

    #lessonInfo {
      font-size: var(--lesson-font-size, 32px);
      font-weight: 800;
      padding: 10px 30px;
      border-radius: 30px;
      background: rgba(0, 255, 245, 0.2);
      border: 2px solid #00fff5;
      color: #00fff5;
      transition: all 0.3s ease;
      text-shadow: 0 0 15px rgba(0, 255, 245, 0.5);
    }

    .admin-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 650px;
      max-height: 85vh;
      background: rgba(20, 30, 50, 0.95);
      color: #fff;
      padding: 20px;
      border-radius: 20px;
      z-index: 100;
      box-shadow: 0 0 100px rgba(0,0,0,0.8);
      overflow-y: auto;
      border: 2px solid rgba(0, 255, 245, 0.3);
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.9);
      z-index: 99;
    }

    .modal-title {
      color: #00fff5;
      margin: 0 0 15px 0;
      font-size: 22px;
      text-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 245, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(0, 255, 245, 0.3);
      border-color: #00fff5;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .style-control {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 10px;
    }

    .style-control label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
    }

    .style-control input[type="range"] {
      width: 100%;
      accent-color: #00fff5;
      cursor: pointer;
    }

    .style-control input[type="text"],
    .style-control select,
    .style-control textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 245, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .style-control textarea {
      resize: vertical;
      min-height: 65px;
    }

    .section-title {
      font-weight: 800;
      color: #00fff5;
      margin: 15px 0 8px 0;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #scheduleInputs {
      max-height: 250px;
      overflow-y: auto;
      padding-right: 8px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .input-row input {
      padding: 8px 6px;
      border-radius: 6px;
      border: 1px solid rgba(0,255,245,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 13px;
    }

    .input-row input[type="text"] {
      width: 45px;
    }

    .input-row input[type="time"] {
      flex: 1;
    }

    .input-row button {
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .backup-zone {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed rgba(255,255,255,0.3);
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-backup {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-add {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-save {
      background: #1a2a6c;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 10px;
      opacity: 0.4;
      transition: 0.3s;
      z-index: 5;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
    }

    .footer:active, .footer:hover {
      opacity: 1;
    }

    .footer button {
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .footer button:active {
      background: rgba(0, 255, 245, 0.2);
      border-color: #00fff5;
      transform: scale(0.95);
    }

    #alertStatus {
      font-size: var(--alert-font-size, 26px);
      font-weight: 900;
      padding: 8px 28px;
      border-radius: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
    }

    #alertStatus.calm {
      border-color: #2ecc71;
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
    }

    #alertStatus.alert {
      border-color: #ff0000;
      background: rgba(255, 0, 0, 0.25);
      color: #ff2b2b;
      text-shadow: 0 0 25px rgba(255, 0, 0, 1);
      animation: alertBlink 0.8s infinite;
    }

    @keyframes alertBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @media (max-width: 900px) {
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-container">
    <div id="bgLayer1" class="bg-image-layer"></div>
    <div id="bgLayer2" class="bg-image-layer"></div>
    <iframe id="bgIframe" class="bg-iframe-layer" src="about:blank"></iframe>
  </div>
  <div class="bg-overlay"></div>

  <div id="weather-effects"></div>
  <div class="modal-overlay" id="overlay" onclick="toggleAdmin()"></div>

  <div class="admin-modal" id="adminModal">
    <h2 class="modal-title">⚙️ Налаштування</h2>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('scheduleTab')">📅 Розклад</button>
      <button class="tab-btn" onclick="switchTab('displayTab')">🎨 Розміри та Вигляд</button>
    </div>

    <div id="scheduleTab" class="tab-content active">
      <div id="scheduleInputs"></div>
      <button onclick="addInputRow()" class="btn-add">+ Додати урок</button>
      <button onclick="saveSchedule()" class="btn-save">💾 Зберегти розклад</button>

      <div class="backup-zone">
        <button onclick="exportSchedule()" class="btn-backup" style="background: #3498db;">📥 Експорт</button>
        <button onclick="document.getElementById('importFile').click()" class="btn-backup" style="background: #e67e22;">📤 Імпорт</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importSchedule(this)">
      </div>
    </div>

    <div id="displayTab" class="tab-content">
      <div class="section-title">🖼️ Налаштування Фону</div>

      <div class="style-control">
        <label>Тип фону:</label>
        <select id="bgType" onchange="handleBgTypeChange(this.value)">
          <option value="image">Статична картинка</option>
          <option value="slideshow">Слайд-шоу</option>
          <option value="iframe">HTML5 / Сайт (iframe)</option>
        </select>
      </div>

      <div class="style-control bg-field bg-field-image">
        <label>URL картинки:</label>
        <input type="text" id="bgImageUrl" placeholder="https://..." onchange="saveBgSettings()">
      </div>

      <div class="style-control bg-field bg-field-slideshow" style="display:none;">
        <label>URL картинок (по 1 у рядку):</label>
        <textarea id="bgSlideshowUrls" placeholder="https://image1.jpg&#10;https://image2.jpg" onchange="saveBgSettings()"></textarea>
      </div>

      <div class="style-control bg-field bg-field-slideshow" style="display:none;">
        <label>Інтервал слайдів (секунд): <span id="val_bgInterval">10s</span></label>
        <input type="range" id="bgInterval" min="3" max="60" value="10" oninput="document.getElementById('val_bgInterval').innerText = this.value + 's'; saveBgSettings();">
      </div>

      <div class="style-control bg-field bg-field-iframe" style="display:none;">
        <label>URL веб-сторінки / HTML5 вмісту:</label>
        <input type="text" id="bgIframeUrl" placeholder="https://..." onchange="saveBgSettings()">
      </div>

      <div class="section-title">📐 Розміри елементів</div>

      <div class="style-control">
        <label>🖼️ Висота логотипу: <span id="val_logoHeight">80px</span></label>
        <input type="range" id="size_logoHeight" min="40" max="150" value="80" oninput="updateSize('logoHeight', this.value, 'px')">
      </div>

      <div class="style-control">
        <label>🚨 Розмір статусу тривоги: <span id="val_alertFont">26px</span></label>
        <input type="range" id="size_alertFont" min="14" max="45" value="26" oninput="updateSize('alertFont', this.value, 'px')">
      </div>

      <div class="style-control">
        <label>⏰ Розмір годинника: <span id="val_clockFont">100px</span></label>
        <input type="range" id="size_clockFont" min="40" max="160" value="100" oninput="updateSize('clockFont', this.value, 'px')">
      </div>

      <div class="style-control">
        <label>📅 Розмір дати: <span id="val_dateFont">16px</span></label>
        <input type="range" id="size_dateFont" min="12" max="30" value="16" oninput="updateSize('dateFont', this.value, 'px')">
      </div>

      <div class="style-control">
        <label>🔔 Розмір статусу пари: <span id="val_lessonFont">32px</span></label>
        <input type="range" id="size_lessonFont" min="16" max="50" value="32" oninput="updateSize('lessonFont', this.value, 'px')">
      </div>

      <div class="style-control">
        <label>📝 Розмір шрифту замін: <span id="val_replacesFont">13px</span></label>
        <input type="range" id="size_replacesFont" min="10" max="24" value="13" oninput="updateSize('replacesFont', this.value, 'px')">
      </div>

      <button onclick="resetDisplaySizes()" class="btn-backup" style="background: #e74c3c; width: 100%; margin-top: 10px;">🔄 Скинути розміри та фон до дефолтних</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="logo.webp" alt="Лого" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Crect fill=%22%2300fff5%22 width=%22180%22 height=%22180%22/%3E%3Ctext x=%2290%22 y=%22100%22 font-size=%2240%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%231a2a6c%22%3EДТЕФК%3C/text%3E%3C/svg%3E'">
      </div>
      <div class="weather"><span id="weatherIcon">☀️</span><span id="temp">--</span>°</div>
    </div>

    <div class="content">
      <div class="replaces-panel">
        <div class="replaces-title"><span>📝 ЗАМІНИ</span><span id="pageInfo" style="font-size: 14px; opacity: 0.7;">0/0</span></div>
        <div id="replacesList"></div>
      </div>

      <div class="center-display">
        <div id="alertStatus" class="unknown">❔ Перевірка тривоги...</div>
        <h1 id="clock">00:00</h1>
        <div id="date">Завантаження...</div>
        <div id="lessonInfo">Очікування...</div>
      </div>
    </div>

    <div class="footer">
      <button onclick="toggleAdmin()" title="Налаштування">⚙️ Налаштування</button>
      <button onclick="fetchReplaces()" title="Оновити">🔄 Оновити</button>
      <button onclick="toggleFullscreen()" title="Екран">🖥 Екран</button>
    </div>
  </div>

  <audio id="bell"></audio>

  <script src="script.js"></script>
</body>
</html>
