name: Оновлення замін

on:
  schedule:
    - cron: '*/10 4-16 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-replaces
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-replaces.mjs
      - name: Commit replaces.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add replaces.json
          if git diff --cached --quiet; then
            echo "Замін без змін"
          else
            git commit -m "🔄 Оновлено заміни"
            git push
          fi
